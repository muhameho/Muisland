name: Windows and Linux builds
on:
  push:
    branches: [main]
    paths: ['src/**', 'linux/**', 'Cargo.*', 'build.sh', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muisland-Windows-x64
          path: target/release/muisland.exe
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux runtime and test dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          . /etc/os-release
          sources="$(mktemp)"
          trap 'rm -f -- "$sources"' EXIT
          # Runner images include unrelated vendor repositories. Only signed
          # Ubuntu archives are needed for this job's runtime dependencies.
          printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu %s main restricted universe multiverse\n' "$VERSION_CODENAME" "${VERSION_CODENAME}-updates" > "$sources"
          printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu %s-security main restricted universe multiverse\n' "$VERSION_CODENAME" >> "$sources"
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends python3-gi python3-gi-cairo python3-cryptography gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libsecret-tools gnome-keyring gir1.2-gtklayershell-0.1 dbus-x11 xvfb xauth sway desktop-file-utils
      - run: python3 -m unittest discover -s linux -v
      - run: dbus-run-session -- bash linux/keyring_test.sh
      - run: bash build.sh --deb
      - run: bash build.sh --tar
      - run: bash build.sh --source
      - run: bash linux/package-test.sh dist/*-linux-any.tar.gz
      - run: bash linux/package-test.sh
      - run: sudo dpkg -i dist/*.deb
      - run: /usr/bin/muisland --version
      - run: desktop-file-validate linux/muisland.desktop
      - run: timeout 30s dbus-run-session -- xvfb-run -a bash linux/instance-test.sh
      - run: dbus-run-session -- bash linux/wayland-test.sh
      - run: dbus-run-session -- xvfb-run -a ./target/release/muisland --preview --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muisland-${{ matrix.os }}-x64
          path: |
            dist/*.deb
            dist/*.tar.gz

  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg DISTRO=debian:12 -f linux/Dockerfile.test -t muisland-debian .
      - run: docker run --rm muisland-debian
      - run: docker run --rm muisland-debian dbus-run-session -- bash linux/keyring_test.sh
      - run: docker run --rm --user 65534:65534 --env HOME=/tmp/muisland-test muisland-debian dbus-run-session -- bash linux/wayland-test.sh

  linux-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora:44
            label: Fedora
          - distro: archlinux:base
            label: Arch
          - distro: opensuse/tumbleweed:latest
            label: openSUSE
          - distro: alpine:3.23
            label: Alpine-musl
    name: Linux runtime (${{ matrix.label }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --build-arg DISTRO=${{ matrix.distro }} -f linux/Dockerfile.runtime -t muisland-runtime .
      - run: docker run --rm muisland-runtime
      - run: docker run --rm --user 65534:65534 --env HOME=/tmp/muisland-test muisland-runtime dbus-run-session -- bash linux/keyring_test.sh
      - run: docker run --rm --user 65534:65534 --env HOME=/tmp/muisland-test muisland-runtime dbus-run-session -- bash linux/wayland-test.sh
