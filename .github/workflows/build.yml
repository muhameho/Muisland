name: Windows and Ubuntu builds
on:
  push:
    branches: [main]
    paths: ['src/**', 'linux/**', 'Cargo.*', 'build.sh', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muisland-Windows-x64
          path: target/release/muisland.exe
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux runtime and test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo python3-cryptography gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libsecret-tools dbus-x11 xvfb xauth
      - run: python3 -m unittest discover -s linux -v
      - run: bash build.sh --deb
      - run: dbus-run-session -- xvfb-run -a ./target/release/muisland --preview --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Muisland-Ubuntu-x64
          path: dist/*.deb
