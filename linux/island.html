<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src data:;connect-src 'none';base-uri 'none';form-action 'none'"
    />
    <meta name="description" content="Muisland: a floating usage circle and account switcher for Claude and Codex. Interactive demo with sample data." />
    <title>Muisland</title>
    <!--
      One file, three uses:
        * the Linux island (WebKitGTK; the native shell sets window.ISLAND_ROLE
          to "float", "bubble" or "menu" and bridges actions to backend.py),
        * a standalone preview of a single role (?role=menu),
        * the public interactive demo (no role, no native bridge), published
          from demo/index.html, which is a byte-for-byte copy of this file.
      The look mirrors the Windows renderer (src/ui.rs, src/theme.rs).
    -->
    <style>
      :root {
        --font: Inter, "Segoe UI Variable Text", "Segoe UI", "Noto Sans", "Noto Sans Arabic", system-ui, sans-serif;
        --spring: cubic-bezier(0.34, 1.45, 0.5, 1);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --dir: 1;
        color-scheme: dark;
        --bg: #0c0d14;
        --surface: #151722;
        --raised: #1e2130;
        --line: #282c3f;
        --text: #f4f5fa;
        --muted: #8f94ae;
        --accent: #8b7cff;
        --accent2: #4cc9ff;
        --on-accent: #0b0c12;
        --warn: #ffb547;
        --danger: #ff6170;
        --good: #4ade9b;
      }
      html[dir="rtl"] {
        --dir: -1;
        --font: "Segoe UI Variable Text", "Segoe UI", "Noto Sans Arabic", "Noto Naskh Arabic", Inter, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        color: var(--text);
        font: 14px/1.4 var(--font);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      svg {
        display: block;
      }

      /* Buttons */
      .btn {
        height: 44px;
        border-radius: 14px;
        background: var(--raised);
        padding: 0 18px;
        font-weight: 650;
        font-size: 14.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        transition:
          transform 0.35s var(--spring),
          filter 0.2s,
          background 0.2s,
          opacity 0.2s;
      }
      .btn:hover {
        filter: brightness(var(--hover, 1.14));
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: progress;
      }
      .btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--on-accent);
        box-shadow: 0 8px 22px -12px var(--accent);
      }
      .btn.danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--raised);
        filter: none;
      }
      .btn.wide {
        width: 100%;
        margin-bottom: 8px;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--muted);
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.35s var(--spring);
      }
      .icon-btn:hover {
        background: var(--raised);
        color: var(--text);
      }
      .icon-btn:active {
        transform: scale(0.9);
      }
      .icon-btn.on {
        background: var(--raised);
        color: var(--accent);
      }
      .icon-btn svg {
        transition: transform 0.6s var(--spring);
      }
      .icon-btn.on .gear {
        transform: rotate(90deg);
      }
      html[dir="rtl"] .flip {
        transform: scaleX(-1);
      }

      /* Panel */
      .surface {
        position: relative;
        width: 420px;
        height: 628px;
        border-radius: 28px;
        background:
          radial-gradient(130% 55% at 0% 0%, var(--accent-glow), transparent 62%),
          var(--bg);
        box-shadow: inset 0 0 0 1px var(--edge);
        display: flex;
        flex-direction: column;
        padding: 18px 18px 14px;
        overflow: hidden;
      }
      html[dir="rtl"] .surface {
        background:
          radial-gradient(130% 55% at 100% 0%, var(--accent-glow), transparent 62%),
          var(--bg);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        flex: none;
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        flex: none;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--on-accent);
        box-shadow: 0 8px 20px -10px var(--accent);
      }
      .brand {
        flex: 1;
        min-width: 0;
      }
      .brand b {
        display: block;
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.2px;
      }
      .brand small,
      .ellipsis {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .brand small {
        color: var(--muted);
        font-size: 12.5px;
      }
      .tabs,
      .seg {
        position: relative;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        border-radius: 15px;
        padding: 4px;
      }
      .tabs {
        flex: none;
        margin: 14px 0;
        height: 48px;
        background: var(--surface);
      }
      .tabs > i,
      .seg > i {
        position: absolute;
        top: 4px;
        bottom: 4px;
        inset-inline-start: 4px;
        width: calc((100% - 8px) / var(--n));
        border-radius: 11px;
        background: var(--raised);
        box-shadow:
          0 4px 14px -6px var(--shadow),
          inset 0 1px 0 var(--sheen);
        transform: translateX(calc(var(--i) * 100% * var(--dir)));
        transition: transform 0.5s var(--spring);
      }
      .tabs button,
      .seg button {
        position: relative;
        z-index: 1;
        color: var(--muted);
        font-weight: 650;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border-radius: 11px;
        transition: color 0.25s;
      }
      .tabs button {
        font-size: 15px;
      }
      .tabs button.on,
      .seg button.on {
        color: var(--text);
      }
      .tabs button:hover,
      .seg button:hover {
        color: var(--text);
      }
      .pdot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--c);
        opacity: 0.55;
        transition: opacity 0.25s, box-shadow 0.25s;
      }
      .on > .pdot {
        opacity: 1;
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent);
      }
      .pages {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .page {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      .page.busy {
        pointer-events: none;
      }
      .page-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        margin-bottom: 10px;
        flex: none;
      }
      .page-head h1 {
        flex: 1;
        margin: 0;
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.4px;
      }
      .back {
        margin-inline-start: -8px;
      }
      .scroll {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        margin: 0 -10px;
        padding: 2px 10px 18px;
        overscroll-behavior: contain;
        -webkit-mask-image: linear-gradient(transparent, #000 8px, #000 calc(100% - 22px), transparent);
        mask-image: linear-gradient(transparent, #000 8px, #000 calc(100% - 22px), transparent);
        scrollbar-width: thin;
        scrollbar-color: var(--raised) transparent;
      }
      .scroll::-webkit-scrollbar {
        width: 6px;
      }
      .scroll::-webkit-scrollbar-thumb {
        background: var(--raised);
        border-radius: 6px;
      }
      .foot {
        flex: none;
        margin-top: 10px;
        height: 44px;
        border-radius: 14px;
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 14px;
        font-size: 13.5px;
        font-weight: 600;
      }
      .foot .ellipsis {
        flex: 1;
        min-width: 0;
      }
      .foot small {
        color: var(--muted);
        font-weight: 600;
        flex: none;
      }
      .sdot {
        width: 9px;
        height: 9px;
        flex: none;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }
      .sdot.warn {
        background: var(--warn);
        box-shadow: 0 0 0 4px var(--warn-soft);
      }
      .sdot.live,
      .sdot.busy {
        animation: pulse 1.8s ease-in-out infinite;
      }
      .sdot.busy {
        animation-duration: 0.9s;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 7px transparent;
        }
      }

      /* Accounts */
      .card {
        position: relative;
        background: var(--surface);
        border-radius: 20px;
        padding: 15px 17px 13px;
        margin-bottom: 10px;
        box-shadow: inset 0 0 0 1.5px var(--card-edge, transparent);
        transition:
          transform 0.4s var(--spring),
          box-shadow 0.25s,
          background 0.25s;
      }
      .card[data-switch] {
        cursor: pointer;
      }
      .card[data-switch]:hover {
        transform: translateY(-2px);
        --card-edge: var(--line);
      }
      .card[data-switch]:active {
        transform: scale(0.985);
      }
      .card.active {
        --card-edge: var(--accent-line);
      }
      .card.active:hover {
        --card-edge: var(--accent);
      }
      .card-top {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .avatar {
        position: relative;
        width: 46px;
        height: 46px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 750;
        font-size: 17px;
        text-shadow: 0 1px 2px #0003;
      }
      .avatar i {
        position: absolute;
        inset-inline-end: -1px;
        bottom: -1px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 0 3px var(--surface);
      }
      .who {
        flex: 1;
        min-width: 0;
      }
      .who b {
        font-size: 16.5px;
        font-weight: 700;
      }
      .who small {
        color: var(--muted);
        font-size: 13px;
        margin-top: 1px;
      }
      .who small.good {
        color: var(--good);
      }
      .who small.bad {
        color: var(--warn);
      }
      .mini {
        height: 34px;
        min-width: 34px;
        padding: 0 11px;
        border-radius: 11px;
        font-weight: 650;
        font-size: 14px;
        display: grid;
        place-items: center;
        color: var(--text);
        transition:
          background 0.2s,
          transform 0.35s var(--spring);
      }
      .mini.muted {
        color: var(--muted);
        padding: 0;
      }
      .mini:hover {
        background: var(--raised);
      }
      .mini:active {
        transform: scale(0.9);
      }
      .quotas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-top: 13px;
      }
      .q-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .q-row b {
        color: var(--text);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        position: relative;
        height: 6px;
        border-radius: 6px;
        background: var(--raised);
        margin: 7px 0 6px;
        overflow: hidden;
      }
      .fill {
        position: absolute;
        top: 0;
        bottom: 0;
        inset-inline-start: 0;
        border-radius: 6px;
        transition: width 0.9s var(--ease), background 0.6s;
        animation: grow 1.1s var(--ease);
      }
      @keyframes grow {
        from {
          width: 0;
        }
      }
      .reset {
        font-size: 12.5px;
        color: var(--muted);
      }
      .err {
        margin-top: 10px;
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--danger);
      }
      .empty {
        text-align: center;
        padding: 46px 18px 10px;
      }
      .empty .orb-art {
        width: 96px;
        height: 96px;
        margin: 0 auto 18px;
        animation: float 5s ease-in-out infinite;
      }
      @keyframes float {
        50% {
          transform: translateY(-6px);
        }
      }
      .empty h2 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      .empty p {
        color: var(--muted);
        margin: 0 0 20px;
      }

      /* Settings */
      .sec {
        font-size: 12.5px;
        font-weight: 750;
        letter-spacing: 0.07em;
        color: var(--accent);
        margin: 20px 2px 10px;
      }
      html[dir="rtl"] .sec {
        letter-spacing: 0;
        font-size: 13.5px;
      }
      .sec:first-child {
        margin-top: 4px;
      }
      .themes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .tile {
        background: var(--surface);
        border-radius: 16px;
        padding: 8px 8px 9px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13.5px;
        font-weight: 600;
        box-shadow: inset 0 0 0 2px transparent;
        transition:
          transform 0.4s var(--spring),
          box-shadow 0.25s;
      }
      .tile:hover {
        transform: translateY(-2px);
      }
      .tile:active {
        transform: scale(0.95);
      }
      .tile.on {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .sw {
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        background: var(--tb);
        box-shadow: inset 0 0 0 1px var(--tl);
      }
      .sw i {
        width: 18px;
        height: 18px;
        flex: none;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--ta), var(--ta2));
      }
      .sw span {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sw span::before,
      .sw span::after {
        content: "";
        height: 3px;
        border-radius: 3px;
        background: var(--tt);
        opacity: 0.85;
      }
      .sw span::after {
        width: 62%;
        opacity: 0.4;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--surface);
        border-radius: 16px;
        padding: 12px 16px;
        margin-bottom: 8px;
        min-height: 56px;
      }
      .row.col {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .lbl {
        flex: 1;
        min-width: 0;
      }
      .lbl b {
        display: block;
        font-weight: 600;
        font-size: 15px;
      }
      .lbl small {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
        margin-top: 2px;
      }
      .lbl output {
        float: inline-end;
        color: var(--accent);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .tog {
        position: relative;
        width: 48px;
        height: 28px;
        flex: none;
        border-radius: 14px;
        background: var(--raised);
        transition: background 0.3s;
      }
      .tog::after {
        content: "";
        position: absolute;
        top: 3px;
        inset-inline-start: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px #0004;
        transition: transform 0.5s var(--spring), width 0.25s;
      }
      .tog:active::after {
        width: 27px;
      }
      .tog.on {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
      }
      .tog.on::after {
        transform: translateX(calc(20px * var(--dir)));
      }
      .tog.on:active::after {
        transform: translateX(calc(15px * var(--dir)));
      }
      .seg {
        height: 40px;
        background: var(--bg);
      }
      .seg button {
        font-size: 13.5px;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 22px;
        margin: 0;
        background: transparent;
        cursor: pointer;
        --fillto: right;
      }
      html[dir="rtl"] input[type="range"] {
        direction: ltr;
        transform: scaleX(-1);
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 6px;
        background: linear-gradient(to var(--fillto), var(--accent) var(--p), var(--raised) var(--p));
      }
      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 6px;
        background: var(--raised);
      }
      input[type="range"]::-moz-range-progress {
        height: 6px;
        border-radius: 6px;
        background: var(--accent);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin-top: -7px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 2px 8px #0005,
          0 0 0 5px var(--accent-soft);
        transition: transform 0.35s var(--spring);
      }
      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 2px 8px #0005,
          0 0 0 5px var(--accent-soft);
      }
      input[type="range"]:active::-webkit-slider-thumb {
        transform: scale(1.18);
      }
      .hint {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.55;
        margin: 2px 4px 10px;
      }
      .about {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 0;
      }

      /* Detail, confirmation and status pages */
      .field {
        width: 100%;
        height: 50px;
        border-radius: 14px;
        background: var(--surface);
        border: 1.5px solid var(--line);
        padding: 0 16px;
        font-size: 16px;
        outline: none;
        user-select: text;
        -webkit-user-select: text;
        transition:
          border-color 0.2s,
          box-shadow 0.3s;
      }
      .field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }
      .field-note {
        font-size: 12.5px;
        color: var(--muted);
        margin: 8px 4px 16px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
        padding-top: 12px;
        flex: none;
      }
      .actions .btn {
        flex: 1;
      }
      .dialog {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 22px 6px 0;
        min-height: 0;
        overflow-y: auto;
      }
      .badge {
        width: 68px;
        height: 68px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        margin-bottom: 18px;
        background: var(--accent-soft);
        color: var(--accent);
        animation: pop 0.6s var(--spring);
      }
      .badge.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .badge.danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
      }
      .dialog h2 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 750;
        letter-spacing: -0.3px;
      }
      .dialog .name {
        color: var(--accent);
        font-weight: 700;
        font-size: 15.5px;
        margin: 0 0 12px;
      }
      .dialog p.copy {
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .countdown {
        position: relative;
        width: 92px;
        height: 92px;
        margin: 20px auto 0;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 800;
      }
      .countdown svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .countdown circle {
        fill: none;
        stroke-width: 6;
        stroke-linecap: round;
      }

      /* Floating island */
      .island {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
      }
      .island.pill {
        width: 228px;
        height: 58px;
      }
      .orb,
      .pill-body {
        position: relative;
        cursor: pointer;
        background:
          radial-gradient(circle at 32% 24%, var(--raised), var(--bg) 72%);
        box-shadow:
          inset 0 0 0 1px var(--edge),
          inset 0 1px 0 var(--sheen);

          "accent-soft": alpha(t.accent, t.dark ? 0.16 : 0.13),
          "accent-line": alpha(t.accent, 0.6),
          "accent-glow": alpha(t.accent, t.dark ? 0.1 : 0.08),
          "accent2-glow": alpha(t.accent2, t.dark ? 0.07 : 0.06),
          "accent-glow2": alpha(t.accent, t.dark ? 0.22 : 0.16),
          "accent2-glow2": alpha(t.accent2, t.dark ? 0.16 : 0.14),
          "warn-soft": alpha(t.warn, 0.16),
          "danger-soft": alpha(t.danger, t.dark ? 0.14 : 0.1),
          edge: alpha(t.text, t.dark ? 0.07 : 0.09),
          sheen: t.dark ? "rgba(255,255,255,.05)" : "rgba(255,255,255,.7)",
          shadow: t.dark ? "rgba(0,0,0,.6)" : "rgba(27,31,58,.22)",
          hover: t.dark ? 1.14 : 0.96,
        };
        for (const k in vars) st.setProperty("--" + k, vars[k]);
        st.colorScheme = t.dark ? "dark" : "light";
        const lang = arabic() ? "ar" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.documentElement.classList.toggle("reduce", !motion());
      }

      // ---------------------------------------------------------------- text helpers
      const labels = () =>
        data.provider === "codex"
          ? { s: tr("Session"), w: tr("Extended"), ss: tr("SES"), ws: tr("EXT") }
          : { s: tr("5-hour"), w: tr("Weekly"), ss: tr("5H"), ws: tr("7D") };
      function span(seconds) {
        const t = Math.max(0, Math.floor(seconds));
        const d = Math.floor(t / 86400), h = Math.floor((t % 86400) / 3600), m = Math.floor((t % 3600) / 60);
        if (t >= 86400) return tr("{d}d {h}h", { d: num(d), h: num(h) });
        if (t >= 3600) return tr("{h}h {m}m", { h: num(h), m: num(m) });
        return tr("{m}m", { m: num(Math.max(1, m)) });
      }
      function resetText(w) {
        if (!w) return tr("Not available");
        if (!w.resets) return tr("Reset time unavailable");
        const left = w.resets - Date.now() / 1000;
        return left <= 0 ? tr("Reset due · refreshing") : tr("Resets in {t}", { t: span(left) });
      }
      function ago(ts) {
        const s = Math.max(0, Date.now() / 1000 - ts);
        if (s < 60) return tr("just now");
        if (s < 3600) return tr("{n}m ago", { n: num(Math.floor(s / 60)) });
        if (s < 86400) return tr("{n}h ago", { n: num(Math.floor(s / 3600)) });
        return tr("{n}d ago", { n: num(Math.floor(s / 86400)) });
      }
      const active = () => data.accounts.find((a) => a.active);
      // The value the island shows, per the "Percentage of" setting.
      function metric(u) {
        const L = labels(), s = u?.session?.used, w = u?.weekly?.used;
        const pick = S().circle_metric || "session";
        if (pick === "weekly") return { used: w ?? null, label: L.ws };
        if (pick === "max") {
          if (s == null && w == null) return { used: null, label: tr("MAX") };
          return { used: Math.max(s ?? 0, w ?? 0), label: tr("MAX") };
        }
        return { used: s ?? w ?? null, label: s != null ? L.ss : L.ws };
      }
      function statusOf(a) {
        if (a.draft) return [tr("Draft · enter a name, then save"), ""];
        let text, cls = "";
        if (data.preview) {
          text = a.active ? tr("Active · sample data") : a.saved ? tr("Saved · sample data") : tr("Not saved · Save to link");
          cls = a.active ? "good" : "";
        } else if (a.error) {
          text = tr("Usage unavailable · see details");
          cls = "bad";
        } else if (a.active) {
          text = a.saved ? tr("Active") : tr("Not saved · Save to link");
          cls = a.saved ? "good" : "bad";
        } else text = a.saved ? (a.usage ? tr("Saved") : tr("Saved · reading usage…")) : tr("Not saved · Save to link");
        if (a.usage?.local) text += tr(" · Claude local sample");
        return [text, cls];
      }

      // ---------------------------------------------------------------- icons
      const ICON = {
        logo: (s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 18.5V7.2c0-1 1.2-1.4 1.9-.7L12 12.6l5.6-6.1c.7-.7 1.9-.3 1.9.7v11.3"/></svg>`,
        gear: `<svg class="gear" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
        close: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
        back: `<svg class="flip" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
        plus: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
        dots: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>`,
        swap: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>`,
        save: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>`,
        trash: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
        restore: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>`,
        info: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>`,
        bolt: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>`,
        lock: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`,
        globe: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>`,
        palette: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-2-.5-1.3.4-2.5 1.8-2.5H18a3 3 0 0 0 3-3C21 7.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>`,
        bell: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>`,
        ring: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".35"/><path d="M12 3a9 9 0 0 1 8.5 12"/><circle cx="12" cy="12" r="4.5" opacity=".35"/><path d="M12 7.5a4.5 4.5 0 0 1 4.5 4.5"/></svg>`,
        switcher: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>`,
      };

      // ---------------------------------------------------------------- components
      function rings(id, size, r1, r2, w1, w2, outer, inner) {
        const c = size / 2;
        const arc = (r, w, used, grad) => {
          const C = 2 * Math.PI * r, u = used == null ? 0 : clamp(used, 0, 100);
          const off = C * (1 - u / 100);
          return `<circle class="track" cx="${c}" cy="${c}" r="${r}" stroke-width="${w}"/><circle class="arc" cx="${c}" cy="${c}" r="${r}" stroke-width="${w}" stroke="url(#${grad})" stroke-dasharray="${C.toFixed(2)}" style="--c:${C.toFixed(2)};stroke-dashoffset:${off.toFixed(2)};opacity:${u < 0.5 ? 0 : 1}"/>`;
        };
        const grad = (gid, used) => {
          const [a, b] = usageColors(used);
          return `<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
        };
        return `<svg class="rings" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs>${grad(id + "o", outer)}${grad(id + "i", inner)}</defs>${arc(r1, w1, outer, id + "o")}${arc(r2, w2, inner, id + "i")}</svg>`;
      }
      function centerHTML(id, small) {
        if (!S().circle_numbers) return `<span class="mark">${ICON.logo(small ? 18 : 26)}</span>`;
        const m = metric(active()?.usage);
        const v = m.used == null ? "—" : `<span data-num="${Math.round(m.used)}" data-k="${id}">${num(Math.round(m.used))}</span><sup>${arabic() ? "٪" : "%"}</sup>`;
        return `<span class="center ${small ? "small" : ""}"><span class="v">${v}</span>${small ? "" : `<em>${esc(m.label)}</em>`}</span>`;
      }
      function islandHTML(id) {
        const u = active()?.usage, s = u?.session?.used, w = u?.weekly?.used;
        const title = tr("Open Muisland");
        if (S().circle)
          return `<div class="island"><div class="orb" role="button" tabindex="0" data-open aria-label="${esc(title)}">${rings(id, 68, 30.5, 23.5, 4.5, 4, w, s)}${centerHTML(id + "n")}</div></div>`;
        const L = labels(), a = active();
        const detail = [s != null ? `${L.ss} ${pctText(Math.round(s))}` : "", w != null ? `${L.ws} ${pctText(Math.round(w))}` : ""].filter(Boolean).join(" · ");
        return `<div class="island pill"><div class="pill-body" role="button" tabindex="0" data-open aria-label="${esc(title)}"><span class="pill-ring">${rings(id, 44, 19.5, 14, 3.5, 3, w, s)}${centerHTML(id + "n", true)}</span><span class="pill-text"><b class="ellipsis">${esc(a?.name || "Muisland")}</b><small class="ellipsis">${esc(detail || tr("Click to open"))}</small></span></div></div>`;
      }
      function quotaHTML(label, w, k, cls = "") {
        const used = w ? Math.round(w.used) : null;
        const [a, b] = usageColors(w?.used);
        const dirn = arabic() ? "to left" : "to right";
        return `<div class="${cls}"><div class="q-row"><span>${esc(label)}</span><b>${used == null ? "—" : pctText(used)}</b></div><div class="bar"><div class="fill" data-k="${k}" style="width:${w ? clamp(w.used, 0, 100) : 0}%;background:linear-gradient(${dirn},${a},${b})"></div></div><div class="reset">${esc(resetText(w))}</div></div>`;
      }
      function avatarHTML(a, size) {
        const [c1, c2] = avatarColors(a?.name);
        const letter = esc(([...(a?.name || "?").trim()][0] || "?").toUpperCase());
        return `<span class="avatar" style="background:linear-gradient(135deg,${c1},${c2});${size ? `width:${size}px;height:${size}px` : ""}">${letter}${a?.active ? "<i></i>" : ""}</span>`;
      }
      function bubbleHTML(id) {
        const a = active(), u = a?.usage, L = labels(), m = metric(u);
        const [u1, u2] = usageColors(m.used);
        const provider = data.provider === "codex" ? "Codex" : "Claude";
        const sub = [provider, u?.plan].filter(Boolean).join(" · ");
        const big = m.used == null ? "—" : `<span data-num="${Math.round(m.used)}" data-k="${id}">${num(Math.round(m.used))}</span>${arabic() ? "٪" : "%"}`;
        return `<div class="bubble" role="button" tabindex="0" data-open style="--u1:${u1};--u2:${u2}"><div class="b-top">${avatarHTML(a || { name: "M" })}<div class="who"><b class="ellipsis">${esc(a?.name || tr("No linked account"))}</b><small class="ellipsis">${esc(sub)}</small></div><div class="big"><b>${big}</b><em>${esc(m.label)}</em></div></div><div class="rule"></div>${quotaHTML(L.s, u?.session, id + "s", "b-q")}${quotaHTML(L.w, u?.weekly, id + "w", "b-q")}<div class="rule"></div><div class="b-foot"><span>${tr("Click to open")}</span><span>${u?.updated ? esc(ago(u.updated)) : ""}</span></div></div>`;
      }

      // Menu pages ---------------------------------------------------------
      const DEPTH = { home: 0, settings: 1, edit: 1, confirm: 2, notice: 2, auto: 2 };
      function head(title, back, extra = "") {
        return `<div class="page-head">${back ? `<button class="icon-btn back" data-back aria-label="${esc(tr("Back"))}">${ICON.back}</button>` : ""}<h1>${esc(title)}</h1>${extra}</div>`;
      }
      function homePage() {
        const L = labels();
        let list = data.accounts
          .map((a) => {
            const [st, cls] = statusOf(a);
            return `<article class="card ${a.active ? "active" : ""}" data-key="acct-${a.slot}" data-switch="${a.slot}" tabindex="0"><div class="card-top">${avatarHTML(a)}<div class="who"><b class="ellipsis">${esc(a.name)}</b><small class="ellipsis ${cls}">${esc(st)}</small></div><button class="mini" data-save="${a.slot}">${tr("Save")}</button><button class="mini muted" data-edit="${a.slot}" aria-label="${esc(tr("Account options"))}">${ICON.dots}</button></div><div class="quotas">${quotaHTML(L.s, a.usage?.session, "c" + a.slot + "s")}${quotaHTML(L.w, a.usage?.weekly, "c" + a.slot + "w")}</div>${a.error ? `<div class="err">${esc(a.error)}</div>` : ""}</article>`;
          })
          .join("");
        if (!data.accounts.length)
          list = `<div class="empty"><div class="orb-art">${emptyArt()}</div><h2>${tr("Your island starts here.")}</h2><p>${tr("Add an account, then save its sign-in.")}</p><button class="btn primary" data-add>${ICON.plus}${tr("Add account")}</button></div>`;
        let extra = "";
        if (data.provider === "claude" && data.accounts.length)
          extra = `<div class="row"><div class="lbl"><b>${tr("Back up local data before switch")}</b><small>${tr("Encrypted checkpoint while Claude is closed")}</small></div>${toggle("protect_local")}</div>`;
        return `${head(tr("Accounts"), false, `<button class="btn" data-add style="height:40px">${ICON.plus}${tr("Add")}</button>`)}<div class="scroll" data-key="scroll-home-${data.provider}"><div class="stagger">${list}</div>${extra}</div>`;
      }
      function emptyArt() {
        const t = theme();
        return `<svg viewBox="0 0 96 96" width="96" height="96"><defs><linearGradient id="ea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.accent}"/><stop offset="1" stop-color="${t.accent2}"/></linearGradient></defs><circle cx="48" cy="48" r="44" fill="${t.surface}"/><circle cx="48" cy="48" r="38" fill="none" stroke="${t.raised}" stroke-width="6"/><circle cx="48" cy="48" r="38" fill="none" stroke="url(#ea)" stroke-width="6" stroke-linecap="round" stroke-dasharray="238.8" stroke-dashoffset="80" transform="rotate(-90 48 48)"/><g transform="translate(33 33) scale(1.25)" fill="none" stroke="${t.text}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 18.5V7.2c0-1 1.2-1.4 1.9-.7L12 12.6l5.6-6.1c.7-.7 1.9-.3 1.9.7v11.3"/></g></svg>`;
      }
      const toggle = (key, on = S()[key]) => `<button class="tog ${on ? "on" : ""}" role="switch" aria-checked="${!!on}" data-tog="${key}"></button>`;
      function seg(key, options, current) {
        const i = Math.max(0, options.findIndex(([v]) => v === current));
        return `<div class="seg" style="--n:${options.length};--i:${i}"><i></i>${options.map(([v, label]) => `<button class="${v === current ? "on" : ""}" data-set="${key}" data-val='${JSON.stringify(v)}'>${esc(label)}</button>`).join("")}</div>`;
      }
      function slider(key, label, lo, hi, fallback, step = 0.05) {
        const v = S()[key] ?? fallback, p = ((v - lo) / (hi - lo)) * 100;
        return `<div class="row col"><div class="lbl"><b>${esc(label)}<output>${pctText(Math.round(v * 100))}</output></b></div><input type="range" data-size="${key}" min="${lo}" max="${hi}" step="${step}" value="${v}" style="--p:${p}%" aria-label="${esc(label)}"></div>`;
      }
      function themeTile(i) {
        const isAuto = i === AUTO, t = isAuto ? THEMES[4] : THEMES[i], l = THEMES[8];
        const name = isAuto ? tr("Match system") : arabic() ? t.arabic : t.name;
        const bg = isAuto ? `linear-gradient(90deg,${t.bg} 50%,${l.bg} 50%)` : t.bg;
        return `<button class="tile ${data.theme === i ? "on" : ""}" data-set="theme" data-val="${i}" style="--tb:${bg};--tt:${isAuto ? "#9aa0b8" : t.text};--ta:${t.accent};--ta2:${t.accent2};--tl:${t.line}"><span class="sw"><i></i><span></span></span>${esc(name)}</button>`;
      }
      function settingsPage() {
        const s = S(), L = labels();
        let h = `<div class="sec">${tr("APPEARANCE")}</div><div class="themes">${[...THEMES.keys(), AUTO].map(themeTile).join("")}</div>`;
        h += `<div class="sec">${tr("FLOATING ISLAND")}</div>`;
        h += `<div class="row col"><div class="lbl"><b>${tr("Style")}</b></div>${seg("circle", [[true, tr("Circle")], [false, tr("Pill")]], !!s.circle)}</div>`;
        h += `<div class="row col"><div class="lbl"><b>${tr("Center shows")}</b></div>${seg("circle_numbers", [[true, tr("Percentage")], [false, tr("Logo")]], !!s.circle_numbers)}</div>`;
        h += `<div class="row col"><div class="lbl"><b>${tr("Percentage of")}</b></div>${seg("circle_metric", [["session", L.s], ["weekly", L.w], ["max", tr("Highest")]], s.circle_metric || "session")}</div>`;
        h += slider("float_scale", tr("Island size"), 0.6, 1.8, 1) + slider("bubble_scale", tr("Hover card size"), 0.85, 1.6, 1) + slider("menu_scale", tr("Menu size"), 0.75, 1.6, 1);
        h += `<div class="sec">${tr("LANGUAGE")}</div><div class="row col">${seg("language", [["auto", tr("Automatic")], ["en", "English"], ["ar", "العربية"]], s.language || "auto")}</div>`;
        h += `<div class="sec">${tr("BEHAVIOR")}</div><div class="row"><div class="lbl"><b>${tr("Reduce motion")}</b></div>${toggle("reduced_motion")}</div>`;
        if (native)
          h += `<div class="row"><div class="lbl"><b>${tr("Start with desktop")}</b><small>${esc(data.desktop?.backend || "Linux")}</small></div><button class="tog ${data.desktop?.autostart ? "on" : ""}" role="switch" aria-checked="${!!data.desktop?.autostart}" data-autostart></button></div>`;
        if (native || demo) h += `<button class="btn wide" data-reset-position>${tr("Reset position")}</button>`;
        h += `<div class="sec">${tr("ALERTS & AUTO-SWITCH")}</div><div class="row"><div class="lbl"><b>${tr("Notify at usage thresholds")}</b></div>${toggle("usage_alerts")}</div>`;
        h += slider("session_threshold", tr("Session limit"), 0.05, 1, 0.8) + slider("weekly_threshold", tr("Weekly limit"), 0.05, 1, 0.8);
        h += `<div class="row"><div class="lbl"><b>${tr("Auto-switch at these limits")}</b></div>${toggle("auto_switch")}</div><div class="row"><div class="lbl"><b>${tr("Ask first when work may be open")}</b></div>${toggle("pause_for_work")}</div>`;
        h += `<p class="hint">${tr("Auto-switch waits 15 seconds. Cancel or close the Island to stop it. Open apps may have running tasks; idle detection is not guaranteed.")}</p>`;
        h += `<div class="sec">${tr("SAFETY & RECOVERY")}</div>`;
        if (data.provider === "claude")
          h += `<div class="row"><div class="lbl"><b>${tr("Back up local data before switch")}</b><small>${tr("Encrypted checkpoint while Claude is closed")}</small></div>${toggle("protect_local")}</div>`;
        h += `<button class="btn wide" data-op="rollback">${tr("Restore previous sign-in")}</button>`;
        if (data.provider === "claude") h += `<button class="btn wide" data-op="recover">${tr("Recover local backup to folder")}</button>`;
        h += `<button class="btn wide danger" data-quit>${tr("Quit Muisland")}</button>`;

      const W = 760, H = 720, FLOAT_MARGIN = 26;
      const demoState = { open: false, hover: false, x: W - 76 - FLOAT_MARGIN, y: FLOAT_MARGIN, hideTimer: 0 };
      const demoUsage = { demo_session: 0, demo_weekly: 0 };
      let demoBuilt = false, demoScale = 1, toastTimer = 0;
      const $ = (id) => document.getElementById(id);
      function demoSkeleton() {
        document.body.className = "demo";
        const feature = (icon, title, body) => `<div class="feature"><div class="badge">${icon}</div><h3>${tr(title)}</h3><p>${tr(body)}</p></div>`;
        root.innerHTML = `<div class="site"><nav class="nav"><span class="logo">${ICON.logo(20)}</span><b>Muisland</b><button class="link" id="d-lang">${arabic() ? "English" : "العربية"}</button><a class="link hide-sm" href="https://github.com/muhameho/Muisland">GitHub</a></nav>
          <section class="hero"><div><span class="kicker">${tr("Unofficial · Windows & Linux")}</span><h1 class="hero-title">${tr("Your Claude and Codex accounts, <span>one circle away.</span>")}</h1><p class="lede">${tr("Muisland floats a small usage circle on your desktop. Hover to see your limits, click to switch accounts — with a confirmation every time.")}</p><div class="ctas"><a class="btn primary" href="https://github.com/muhameho/Muisland#readme">${tr("Get Muisland")}</a><a class="btn" href="https://github.com/muhameho/Muisland">${tr("View source")}</a></div><p class="try"><kbd>↗</kbd>${tr("Hover the circle, click it, drag it anywhere.")}</p></div>
          <div><div class="stage-wrap" id="d-wrap"><div class="desk" id="d-desk" aria-label="${esc(tr("Interactive demo · sample accounts"))}"><div class="layer" id="d-bubble"></div><div class="layer" id="d-float"></div><div class="layer" id="d-menu"></div><div class="dock"><i></i><i></i><i></i><i></i><i></i></div><div class="toast" id="d-toast" role="status"></div></div></div>
          <div class="controls" id="d-controls"></div></div></section>
          <section class="features">${feature(ICON.ring, "Live usage rings", "Session and weekly limits as two rings that shift to amber and red as you approach them.")}${feature(ICON.switcher, "Confirmed switching", "Save each sign-in once, then switch accounts with a confirmation. Nothing changes until you agree.")}${feature(ICON.bell, "Alerts and auto-switch", "Get notified at your own thresholds, with an optional auto-switch you can cancel.")}${feature(ICON.palette, "Ten themes", "Dark and light looks, or follow your system automatically.")}${feature(ICON.globe, "English and Arabic", "A full right-to-left interface that follows your system language.")}${feature(ICON.lock, "Stays on your computer", "Saved sign-ins are encrypted locally; usage is read with read-only requests.")}</section>
          <footer class="site-foot"><span>© Muisland · ${tr("Unofficial · not affiliated with Anthropic or OpenAI")}</span><span>${tr("Sample data in your browser. Nothing is sent anywhere.")}</span></footer></div>`;
        demoBuilt = true;
        $("d-menu").classList.toggle("open", demoState.open);
        const fl = $("d-float");
        fl.classList.toggle("away", demoState.open);
        fl.addEventListener("pointerenter", () => demoHover(true));
        fl.addEventListener("pointerleave", () => demoHover(false));
        $("d-bubble").addEventListener("pointerenter", () => demoHover(true));
        $("d-bubble").addEventListener("pointerleave", () => demoHover(false));
        fl.addEventListener("pointerdown", dragStart);
        $("d-menu").addEventListener("click", (e) => {
          e.stopPropagation();
          menuClick(e);
        });
        $("d-desk").addEventListener("click", (e) => {
          if (demoState.open && !e.target.closest("#d-menu")) demoOpen(false);
        });
        if (!demoState.resizeHooked) addEventListener("resize", fitDesk);
        demoState.resizeHooked = true;
        fitDesk();
      }
      function fitDesk() {
        const wrap = $("d-wrap");
        if (!wrap) return;
        demoScale = Math.min(1, wrap.clientWidth / W);
        $("d-desk").style.transform = `scale(${demoScale})`;
        wrap.style.height = H * demoScale + "px";
      }
      function controlsHTML() {
        const a = active(), u = a?.usage, L = labels();
        const sl = (key, label, val) => `<div><div class="lbl"><b>${esc(label)}<output>${pctText(Math.round(val))}</output></b></div><input type="range" data-size="${key}" min="0" max="1" step="0.01" value="${val / 100}" style="--p:${val}%" aria-label="${esc(label)}"></div>`;
        const sw = (i) => {
          const t = i === AUTO ? THEMES[darkQuery.matches ? 4 : 8] : THEMES[i];
          return `<button class="swatch ${data.theme === i ? "on" : ""}" data-set="theme" data-val="${i}" title="${esc(i === AUTO ? tr("Match system") : arabic() ? t.arabic : t.name)}" style="--ta:${t.accent};--ta2:${t.accent2};--tb:${i === AUTO ? "linear-gradient(90deg,#0C0D14 50%,#F4F5FA 50%)" : t.bg};--tl:${t.line}"></button>`;
        };
        return `${sl("demo_session", `${a?.name || ""} · ${L.s}`, Math.round(u?.session?.used ?? 0))}${sl("demo_weekly", L.w, Math.round(u?.weekly?.used ?? 0))}<button class="btn" data-demo-reset>${tr("Reset demo")}</button><div class="swatches"><span>${tr("Theme")}</span>${[...THEMES.keys(), AUTO].map(sw).join("")}</div>`;
      }
      function islandSize() {
        return S().circle ? [76, 76] : [228, 58];
      }
      function placeDemo() {
        const fs = S().float_scale, bs = S().bubble_scale, ms = S().menu_scale;
        const [iw, ih] = islandSize();
        demoState.x = clamp(demoState.x, 8, W - iw * fs - 8);
        demoState.y = clamp(demoState.y, 8, H - ih * fs - 8);
        const fl = $("d-float");
        fl.style.zoom = fs;
        fl.style.left = demoState.x / fs + "px";
        fl.style.top = demoState.y / fs + "px";
        // Hover card beside the island, on the side with room.
        const bw = 312 * bs, bh = 246 * bs, fw = iw * fs, fh = ih * fs;
        const right = demoState.x + fw / 2 < W / 2;
        const bx = clamp(right ? demoState.x + fw + 10 : demoState.x - bw - 10, 8, W - bw - 8);
        const by = clamp(demoState.y + fh / 2 - bh / 2, 8, H - bh - 8);
        const bub = $("d-bubble");
        bub.style.zoom = bs;
        bub.style.left = bx / bs + "px";
        bub.style.top = by / bs + "px";
        bub.style.setProperty("--side", right ? 1 : -1);
        // Panel grows out of the island: centred on it, clamped to the desk.
        const k = Math.min(ms, (H - 16) / 628, (W - 16) / 420);
        const mw = 420 * k, mh = 628 * k;
        const mx = clamp(demoState.x + fw / 2 - mw / 2, 8, W - mw - 8);
        const my = clamp(demoState.y, 8, H - mh - 8);
        const menu = $("d-menu");
        menu.style.zoom = k;
        menu.style.left = mx / k + "px";
        menu.style.top = my / k + "px";
        demoState.origin = [(demoState.x + fw / 2 - mx) / k, (demoState.y + fh / 2 - my) / k];
      }
      function renderDemo() {
        if (!demoBuilt || document.documentElement.lang !== demoState.lang) {
          demoState.lang = document.documentElement.lang;
          demoBuilt = false;
          shownNumbers.clear();
          demoSkeleton();
        }
        paint($("d-float"), islandHTML("df"));
        paint($("d-bubble"), bubbleHTML("db"));
        if (demoState.open) paint($("d-menu"), menuHTML());
        paint($("d-controls"), controlsHTML());
        placeDemo();
      }
      function demoClick(e) {
        if (e.target.closest("#d-lang")) return setSetting("language", arabic() ? "en" : "ar");
        if (e.target.closest("[data-demo-reset]")) {
          resetMock();
          data.accounts = mockProfiles[data.provider];
          Object.assign(demoState, { x: W - 76 - FLOAT_MARGIN, y: FLOAT_MARGIN });
          shownNumbers.clear();
          go("home");
          return toast(tr("Preview complete · no account changes"));
        }
        const sw = e.target.closest("#d-controls [data-set]");
        if (sw) return setSetting("theme", JSON.parse(sw.dataset.val));
        if (demoState.dragged) return (demoState.dragged = false);
        if (e.target.closest("#d-float, #d-bubble [data-open]")) demoOpen(true);
      }
      function demoOpen(open) {
        const menu = $("d-menu"), fl = $("d-float");
        if (open === demoState.open) return {};
        demoState.open = open;
        demoHover(false, true);
        if (open) {
          if (view === "edit" || view === "confirm") view = "home";
          menu.classList.add("open");
          menu.textContent = "";
          paint(menu, menuHTML());
          placeDemo();
          fl.classList.add("away");
          const [ox, oy] = demoState.origin;
          if (motion()) openMorph(menu.querySelector(".surface"), ox + "px", oy + "px");
        } else {
          mock("discard", {});
          const surface = menu.querySelector(".surface");
          const finish = () => {
            if (demoState.open) return;
            menu.classList.remove("open");
            view = "home";
          };
          fl.classList.remove("away");
          if (surface && motion()) {
            const [ox, oy] = demoState.origin;
            surface.animate(
              [
                { clipPath: `circle(120% at ${ox}px ${oy}px)`, opacity: 1 },
                { clipPath: `circle(30px at ${ox}px ${oy}px)`, opacity: 0.2 },
              ],
              { duration: 380, easing: "cubic-bezier(.5,0,.75,0)" },
            ).onfinish = finish;
          } else finish();
        }
        return {};
      }
      function demoHover(inside, force) {
        clearTimeout(demoState.hideTimer);
        const bub = $("d-bubble");
        if (!bub) return {};
        if (inside && !demoState.open && !demoState.dragging && S().circle) {
          bub.classList.add("show");
        } else if (force) bub.classList.remove("show");
        else demoState.hideTimer = setTimeout(() => bub.classList.remove("show"), 260);
        return {};
      }
      function demoResetPosition() {
        Object.assign(demoState, { x: W - 76 - FLOAT_MARGIN, y: FLOAT_MARGIN });
        placeDemo();
        toast(tr("Reset position"));
        return {};
      }
      function dragStart(e) {
        if (e.button !== 0) return;
        const fl = $("d-float"), sx = e.clientX, sy = e.clientY, ox = demoState.x, oy = demoState.y;
        let moved = false;
        const move = (ev) => {
          const dx = (ev.clientX - sx) / demoScale, dy = (ev.clientY - sy) / demoScale;
          if (!moved && Math.hypot(dx, dy) < 4) return;
          if (!moved) {
            fl.setPointerCapture(ev.pointerId);
            moved = demoState.dragging = true;
            fl.classList.add("drag");
            demoHover(false, true);
          }
          demoState.x = ox + dx;
          demoState.y = oy + dy;
          placeDemo();
        };
        const up = () => {
          fl.removeEventListener("pointermove", move);
          fl.removeEventListener("pointerup", up);
          fl.removeEventListener("pointercancel", up);
          fl.classList.remove("drag");
          demoState.dragging = false;
          if (moved) demoState.dragged = true;
          setTimeout(() => (demoState.dragged = false), 0);
        };
        fl.addEventListener("pointermove", move);
        fl.addEventListener("pointerup", up);
        fl.addEventListener("pointercancel", up);
      }
      function setDemoUsage(key, v) {
        const a = active();
        if (!a) return;
        a.usage = a.usage || sampleUsage(0, 0, "Pro");
        a.usage[key === "demo_session" ? "session" : "weekly"].used = Math.round(v * 100);
        a.usage.updated = now();
        render();
      }
      function toast(text) {
        const t = $("d-toast");
        if (!t) return {};
        t.textContent = text;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
        return {};
      }

      // ---------------------------------------------------------------- start
      if (!native) {
        data.preview = true;
        data.version = "";
        data.accounts = mockProfiles.claude;
        if (!demo) document.body.classList.add("solo");
        render();
      } else
        invoke("state")
          .then((v) => {
            data = v;
            render();
          })
          .catch((e) => showNotice(e.message, "danger"));
    </script>
  </body>
</html>
