[package]
name = "muisland"
version = "0.5.1"
edition = "2021"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

